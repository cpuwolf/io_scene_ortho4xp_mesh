<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ortho4XP ↔ Blender workflow</title>
<style>
  * { box-sizing: border-box; }
  body { color: var(--foreground); margin: 0; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #34d399; animation: pulse 2s infinite; flex: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted-foreground); font-size: 14.5px; margin: 0 0 14px 21px; line-height: 1.45; max-width: 830px; }
  svg { display: block; width: 860px; height: auto; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>

<div class="head"><div class="dot"></div><h1>Ortho4XP ↔ Blender workflow</h1></div>
<p class="sub">Two tools, two lanes. They meet over one file: the intermediate <span class="mono">.mesh</span>. X-Plane never reads it — it only reads the final <span class="mono">.dsf</span>.</p>

<svg viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Ortho4XP and Blender exchanging an intermediate mesh file">
  <defs>
    <marker id="ag" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#34d399"/>
    </marker>
    <marker id="ao" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#fb923c"/>
    </marker>
    <marker id="as" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 11 4.5, 0 9" fill="#94a3b8"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--border)" stroke-width=".5" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="860" height="580" fill="url(#grid)"/>

  <!-- order of execution -->
  <line x1="150" y1="46" x2="730" y2="46" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,5" marker-end="url(#as)"/>
  <text x="440" y="34" fill="var(--muted-foreground)" font-size="12.5" text-anchor="middle">the order you run things</text>

  <!-- hand-off arrows (behind the boxes) -->
  <line x1="260" y1="216" x2="260" y2="292" stroke="#34d399" stroke-width="2" marker-end="url(#ag)"/>
  <text x="276" y="262" fill="#34d399" font-size="13.5" font-weight="650">hand&#8209;off 1 · the .mesh</text>
  <text x="276" y="280" fill="var(--muted-foreground)" font-size="12.5">you edit this file</text>

  <line x1="600" y1="292" x2="600" y2="220" stroke="#fb923c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="616" y="262" fill="#fb923c" font-size="13.5" font-weight="650">hand&#8209;off 2 · same file</text>
  <text x="616" y="280" fill="var(--muted-foreground)" font-size="12.5">overwritten in place</text>

  <!-- ============ Ortho4XP lane ============ -->
  <rect x="70" y="76" width="760" height="160" rx="12" fill="rgba(52,211,153,.05)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="46" y="156" fill="#34d399" font-size="15.5" font-weight="700" text-anchor="middle" transform="rotate(-90 46 156)" letter-spacing=".5">ORTHO4XP</text>

  <rect x="110" y="106" width="300" height="110" rx="6" fill="var(--card)"/>
  <rect x="110" y="106" width="300" height="110" rx="6" fill="rgba(52,211,153,.13)" stroke="#34d399" stroke-width="1.5"/>
  <text x="125" y="138" fill="var(--foreground)" font-size="16" font-weight="650">Create scenery</text>
  <text x="125" y="164" fill="var(--muted-foreground)" font-size="13">Step 1–2 · builds the terrain,</text>
  <text x="125" y="184" fill="var(--muted-foreground)" font-size="13">writes the intermediate mesh</text>
  <text x="125" y="206" fill="#34d399" font-size="12.5" class="mono">Data+27+089.mesh</text>

  <rect x="450" y="106" width="300" height="110" rx="6" fill="var(--card)"/>
  <rect x="450" y="106" width="300" height="110" rx="6" fill="rgba(52,211,153,.13)" stroke="#34d399" stroke-width="1.5"/>
  <text x="465" y="138" fill="var(--foreground)" font-size="16" font-weight="650">Build Imagery + DSF</text>
  <text x="465" y="164" fill="var(--muted-foreground)" font-size="13">Step 3 · reads that mesh, adds</text>
  <text x="465" y="184" fill="var(--muted-foreground)" font-size="13">textures, writes the final .dsf</text>
  <text x="465" y="206" fill="#34d399" font-size="12.5" class="mono">+27+089.dsf → X-Plane</text>

  <!-- ============ Blender lane ============ -->
  <rect x="70" y="300" width="760" height="160" rx="12" fill="rgba(251,146,60,.05)" stroke="#fb923c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="46" y="380" fill="#fb923c" font-size="15.5" font-weight="700" text-anchor="middle" transform="rotate(-90 46 380)" letter-spacing=".5">BLENDER</text>

  <rect x="110" y="330" width="640" height="110" rx="6" fill="var(--card)"/>
  <rect x="110" y="330" width="640" height="110" rx="6" fill="rgba(251,146,60,.13)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="125" y="362" fill="var(--foreground)" font-size="16" font-weight="650">Import → Edit → Export</text>
  <text x="125" y="390" font-size="13" fill="var(--muted-foreground)"><tspan fill="#fb923c" font-weight="650">Import</tspan> — the terrain arrives as editable geometry in your scene</text>
  <text x="125" y="410" font-size="13" fill="var(--muted-foreground)"><tspan fill="#fb923c" font-weight="650">Edit</tspan> — move vertices: lakes, runways, coastlines, rough patches</text>
  <text x="125" y="430" font-size="13" fill="var(--muted-foreground)"><tspan fill="#fb923c" font-weight="650">Export</tspan> — write the changes back into the same file</text>

  <!-- ============ one warning strip ============ -->
  <rect x="70" y="484" width="760" height="76" rx="8" fill="var(--card)"/>
  <rect x="70" y="484" width="760" height="76" rx="8" fill="rgba(251,113,133,.12)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="88" y="510" fill="#fb7185" font-size="14" font-weight="650">⚠ After editing, run Step 3 — never re-run Step 1–2.</text>
  <text x="88" y="532" fill="var(--muted-foreground)" font-size="13">Step 1–2 rebuilds the mesh from scratch and throws your edits away.</text>
  <text x="88" y="550" fill="var(--muted-foreground)" font-size="13">Back the file up if you want to experiment.</text>
</svg>

</body>
</html>
